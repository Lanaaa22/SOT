site_name: SOT ConectaFapes
site_url: https://leds-conectafapes
theme:
  name: material
  favicon: assets/fapesLogo.svg
  font:
    text: Abel
    code: Red Hat Mono
  logo: assets/fapesLogo.svg
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark Mode
      primary: black
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light Mode
      primary: grey
      accent: deep orange

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - extra.css

plugins:
  - search

nav:
  - index.md
  - Domínios: 
      - Edição de Perfil:
        - dominios/edicao-de-perfil/README.md
      - Gestão de Equipe:
        - dominios/gestao-de-equipe/README.md
      - Acompanhamento de Projeto:
        - dominios/acompanhamento-de-projeto/README.md
      - Prestação de Contas:
        - dominios/prestacao-de-contas/README.md
      - Gerar Pagamentos:
        - dominios/gerar-pagamentos/README.md
      - Gestão de Editais:
        - dominios/gestao-de-editais/README.md
      - Gestão de Modalidades / Níveis de Bolsa:
        - dominios/gestao-modalidades/README.md
      - Captação de Projetos:
        - dominios/captacao-de-projetos/README.md